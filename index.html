<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="ホロクル（ホロライブオンリー即売会）の買い回り計画・当日ナビ・予算管理">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="クルナビ">
  <title>クルナビ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="ev-switch" data-act="eventMenu" aria-label="イベントを切り替え">
      <span class="logo" aria-hidden="true">ク</span>
      <span id="ev-name" class="ev-name">…</span>
      <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <span id="net-state" class="net-chip" hidden></span>
    <button id="top-wallet" class="top-wallet" data-act="nav" data-view="go" aria-label="残り予算"></button>
  </header>

  <nav class="tabbar" aria-label="メイン">
    <button data-act="nav" data-view="go"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg><span>当日</span></button>
    <button data-act="nav" data-view="list"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>リスト</span></button>
    <button data-act="nav" data-view="map"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 3 3 5.5v15.5l6-2.5 6 2.5 6-2.5V3l-6 2.5z"/><path d="M9 3v15.5M15 5.5V21"/></svg><span>マップ</span></button>
    <button data-act="nav" data-view="circles"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>サークル</span></button>
    <button data-act="nav" data-view="more"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>設定</span></button>
  </nav>

  <main id="main">
    <section id="v-go" class="view" hidden></section>
    <section id="v-list" class="view" hidden></section>
    <section id="v-map" class="view" hidden></section>
    <section id="v-circles" class="view" hidden></section>
    <section id="v-more" class="view" hidden></section>
  </main>

  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>JavaScript を有効にしてください。</noscript>

  <!-- 読み込み順が依存関係。ビルド不要・file:// でも動作 -->
  <script src="js/util.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/qr.js"></script>
  <script src="data/holocle12.js"></script>
  <!-- 新しいイベントの同梱データはここに追加（例：data/holocle13.js） -->
  <script src="js/shots.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
